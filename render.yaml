# Render "Blueprint" for both deployables (docs/phases/phase-4-deploy).
# In Render: New -> Blueprint -> connect this repo -> it reads this file automatically.
# Two separate services, two separate URLs, by design: api/ is the only process
# that ever holds ANTHROPIC_API_KEY, so it can never be served to the browser
# the way a static site's files are.
services:
  - type: web
    name: occasion-concierge-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7 # also set via .python-version -- belt and suspenders, Render reads either
      - key: ANTHROPIC_API_KEY
        sync: false # set manually in the Render dashboard -- never committed
      - key: CORS_ORIGINS
        sync: false # set to the static site's URL below once it's live, e.g. https://occasion-concierge-web.onrender.com

staticSites:
  - name: occasion-concierge-web
    rootDir: web
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://occasion-concierge-api.onrender.com # update if your actual api/ service URL differs
